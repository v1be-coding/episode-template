# The user commits this, because the agent's App can't write workflows.
# Scans the whole history for secrets, after each merge and weekly (Rule 6).
# PRs scan only their own commits, in deploy.yml's checks. A failure here means a
# secret is already public: rotate it first, then decide whether to rewrite history.
name: secret-history

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 1" # Mondays 03:41 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BETTERLEAKS_VERSION: 1.9.0
      BETTERLEAKS_SHA256: f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks at a fixed version
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo betterleaks.tar.gz "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$BETTERLEAKS_SHA256  betterleaks.tar.gz" | sha256sum -c -
          tar -xzf betterleaks.tar.gz betterleaks
          echo "$PWD" >> "$GITHUB_PATH"
      # --redact keeps a found secret out of this public log. Live validation stays off.
      - name: Scan every commit for secrets
        run: betterleaks git . --redact --no-banner
