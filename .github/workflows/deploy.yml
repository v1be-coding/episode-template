# The user commits this, because the agent's App can't write workflows.
# Slice 4: main deploys production. A ready PR from this repo gets a branch
# environment, and closing the PR destroys it. Slice 6 adds the required chain.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]

permissions: {} # nothing unless a job asks

jobs:
  production:
    if: github.event_name == 'push'
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: production
      account: ${{ vars.ACCOUNT }}
    secrets: inherit

  # Branch environments live in portfolio, whatever the episode's account (ADR-0011).
  # Draft pushes don't deploy, and PRs from other repos are refused (Q5).
  branch:
    if: >-
      github.event_name == 'pull_request' && github.event.action != 'closed' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: pr-${{ github.event.pull_request.number }}
      account: portfolio
    secrets: inherit

  # Waits for a running deploy, through the same concurrency group.
  teardown:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/teardown-target.yml
    with:
      environment: pr-${{ github.event.pull_request.number }}
    secrets: inherit
